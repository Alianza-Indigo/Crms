# Local development infrastructure.
# Portability note (PRD §35.4): the whole platform runs from Docker + env vars,
# so it can be lifted to Railway or any other host without code changes.
services:
  postgres:
    image: postgres:16-alpine
    container_name: crms-postgres
    environment:
      POSTGRES_USER: crms
      POSTGRES_PASSWORD: crms
      POSTGRES_DB: crms
    ports:
      - "5432:5432"
    volumes:
      - crms-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crms -d crms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: crms-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - crms-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: crms-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - crms-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  crms-pg:
  crms-redis:
  crms-minio:
